<!--
  layout.html — Referencia del header y footer compartidos.

  Nota: este proyecto no usa un bundler, así que HTML no puede "incluir"
  este archivo de forma nativa. Si lo cargás con fetch() desde global.js,
  funciona perfecto una vez desplegado (Render), pero falla por CORS si
  abrís los archivos directo con doble clic (file://). Por eso, en
  index.html / snacks.html / eventos.html / tickets.html el mismo bloque
  de header y footer está pegado directamente en cada página — así
  cualquiera puede abrir el sitio local sin servidor y ver todo bien.

  Este archivo queda como la fuente de verdad: si cambiás el menú o el
  footer, actualizá aquí primero y despues replicá el cambio en cada
  página. Si en algún momento agregan un build step (Vite, 11ty, etc.)
  esto se puede convertir en un partial real.
-->
